<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="72%">
      <stop offset="0%" stop-color="#1C1024"/>
      <stop offset="55%" stop-color="#0E0814"/>
      <stop offset="100%" stop-color="#07040A"/>
    </radialGradient>
    <linearGradient id="mag" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7A8E8"/>
      <stop offset="45%" stop-color="#E879D8"/>
      <stop offset="100%" stop-color="#B84AA8"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5DFA4"/>
      <stop offset="45%" stop-color="#E8C87A"/>
      <stop offset="100%" stop-color="#C9A44C"/>
    </linearGradient>
    <filter id="glowM" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowG" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="circle"><circle cx="256" cy="256" r="256"/></clipPath>
  </defs>
  <g clip-path="url(#circle)">
    <rect width="512" height="512" fill="url(#bg)"/>

    <!-- cincin orbit -->
    <circle cx="256" cy="256" r="198" fill="none" stroke="url(#gold)" stroke-width="2" opacity="0.35"/>
    <path d="M 256 58 A 198 198 0 0 1 454 256" fill="none" stroke="url(#mag)" stroke-width="4"
          stroke-linecap="round" filter="url(#glowM)"/>

    <!-- HELIX (double spiral) -->
    <g fill="none" stroke-linecap="round" filter="url(#glowM)">
      <!-- strand 1 (magenta) -->
      <path d="M 256 110 C 340 150, 340 200, 256 250 C 172 300, 172 350, 256 400"
            stroke="url(#mag)" stroke-width="14"/>
      <!-- strand 2 (emas) -->
      <path d="M 256 110 C 172 150, 172 200, 256 250 C 340 300, 340 350, 256 400"
            stroke="url(#gold)" stroke-width="14"/>
    </g>

    <!-- rungs (penghubung DNA) -->
    <g stroke="#FFFFFF" stroke-width="4" opacity="0.5" stroke-linecap="round">
      <line x1="222" y1="146" x2="290" y2="146"/>
      <line x1="212" y1="180" x2="300" y2="180"/>
      <line x1="212" y1="214" x2="300" y2="214"/>
      <line x1="222" y1="250" x2="290" y2="250"/>
      <line x1="212" y1="286" x2="300" y2="286"/>
      <line x1="212" y1="320" x2="300" y2="320"/>
      <line x1="222" y1="354" x2="290" y2="354"/>
    </g>

    <!-- node ujung -->
    <circle cx="256" cy="110" r="11" fill="url(#mag)" filter="url(#glowM)"/>
    <circle cx="256" cy="400" r="11" fill="url(#gold)" filter="url(#glowG)"/>

    <!-- titik orbit -->
    <circle cx="256" cy="58"  r="8" fill="url(#mag)"  filter="url(#glowM)"/>
    <circle cx="454" cy="256" r="7" fill="#E8C87A"    filter="url(#glowG)"/>
    <circle cx="256" cy="454" r="6" fill="#E879D8"    opacity="0.8"/>
    <circle cx="58"  cy="256" r="5" fill="#C9A44C"    opacity="0.75"/>
  </g>
</svg>
