<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="72%">
      <stop offset="0%" stop-color="#1A1520"/>
      <stop offset="55%" stop-color="#0D0A12"/>
      <stop offset="100%" stop-color="#07060A"/>
    </radialGradient>
    <linearGradient id="crab" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9E7A"/>
      <stop offset="45%" stop-color="#E86A4C"/>
      <stop offset="100%" stop-color="#B8452E"/>
    </linearGradient>
    <linearGradient id="violet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B7CF6"/>
      <stop offset="100%" stop-color="#6D5AE6"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="circle"><circle cx="256" cy="256" r="256"/></clipPath>
  </defs>
  <g clip-path="url(#circle)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <!-- cincin -->
    <circle cx="256" cy="256" r="198" fill="none" stroke="url(#violet)" stroke-width="2" opacity="0.4"/>
    <path d="M 256 58 A 198 198 0 0 1 454 256" fill="none" stroke="#E86A4C" stroke-width="4" stroke-linecap="round" filter="url(#glow)"/>
    <!-- capit lobster -->
    <g filter="url(#glow)" fill="none" stroke="url(#crab)" stroke-width="15" stroke-linecap="round">
      <path d="M 176 168 C 138 138, 116 152, 122 184 C 126 206, 148 212, 164 198"/>
      <path d="M 336 168 C 374 138, 396 152, 390 184 C 386 206, 364 212, 348 198"/>
    </g>
    <!-- badan -->
    <ellipse cx="256" cy="268" rx="86" ry="102" fill="url(#crab)" opacity="0.95" filter="url(#glow)"/>
    <!-- segmen -->
    <g stroke="#7A2E1E" stroke-width="3" opacity="0.5">
      <line x1="180" y1="248" x2="332" y2="248"/>
      <line x1="184" y1="282" x2="328" y2="282"/>
      <line x1="192" y1="316" x2="320" y2="316"/>
    </g>
    <!-- mata -->
    <circle cx="228" cy="216" r="13" fill="#0D0A12"/>
    <circle cx="284" cy="216" r="13" fill="#0D0A12"/>
    <circle cx="231" cy="213" r="4.5" fill="#8B7CF6"/>
    <circle cx="287" cy="213" r="4.5" fill="#8B7CF6"/>
    <!-- kaki -->
    <g stroke="url(#crab)" stroke-width="9" stroke-linecap="round" opacity="0.85">
      <path d="M 174 300 L 138 330"/><path d="M 172 336 L 140 372"/>
      <path d="M 338 300 L 374 330"/><path d="M 340 336 L 372 372"/>
    </g>
    <!-- ekor -->
    <path d="M 256 370 C 240 396, 272 404, 256 424" fill="none" stroke="url(#crab)" stroke-width="8" stroke-linecap="round" opacity="0.8"/>
  </g>
</svg>
