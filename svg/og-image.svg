<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0C0D15"/><stop offset="55%" stop-color="#07070C"/><stop offset="100%" stop-color="#12131E"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5DFA4"/><stop offset="35%" stop-color="#E8C87A"/><stop offset="100%" stop-color="#C9A44C"/>
    </linearGradient>
    <linearGradient id="violet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B7CF6"/><stop offset="100%" stop-color="#6D5AE6"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowS" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- grid halus -->
  <g stroke="#232538" stroke-width="1" opacity="0.5">
    <line x1="0" y1="105" x2="1200" y2="105"/><line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/><line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/><line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/><line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- orb ungu kiri -->
  <circle cx="90" cy="560" r="180" fill="#8B7CF6" opacity="0.13" filter="url(#glow)"/>
  <!-- orb emas kanan -->
  <circle cx="1120" cy="80" r="160" fill="#E8C87A" opacity="0.11" filter="url(#glow)"/>

  <!-- logo kotak -->
  <g transform="translate(80, 96)">
    <rect width="150" height="150" rx="34" fill="#12131E" stroke="url(#gold)" stroke-width="2.5"/>
    <g filter="url(#glowS)">
      <path d="M 52 38 L 52 112" stroke="url(#gold)" stroke-width="16" stroke-linecap="round"/>
      <path d="M 52 75 L 104 38" stroke="url(#gold)" stroke-width="16" stroke-linecap="round"/>
      <path d="M 52 75 L 106 112" stroke="url(#gold)" stroke-width="16" stroke-linecap="round"/>
    </g>
    <circle cx="112" cy="46" r="9" fill="#8B7CF6" filter="url(#glowS)"/>
  </g>

  <!-- judul -->
  <text x="272" y="170" font-family="DejaVu Sans, sans-serif" font-size="76" font-weight="bold" fill="url(#gold)" filter="url(#glowS)">KIRO AGENTIC</text>
  <text x="274" y="222" font-family="DejaVu Sans, sans-serif" font-size="30" fill="#A8ADC4">Professional Edition · Node.js · Termux</text>

  <!-- garis pemisah -->
  <line x1="80" y1="300" x2="1120" y2="300" stroke="#232538" stroke-width="2"/>
  <line x1="80" y1="300" x2="420" y2="300" stroke="url(#gold)" stroke-width="3"/>
  <line x1="420" y1="300" x2="620" y2="300" stroke="url(#violet)" stroke-width="3"/>

  <!-- fitur -->
  <g font-family="DejaVu Sans, sans-serif" font-size="34" fill="#F2F3F8">
    <text x="80" y="372">12 Tool Native · Sub-Agent · Auto-Continue</text>
    <text x="80" y="432">92 Skill · 9Router Gateway · Multi-Bot Telegram</text>
    <text x="80" y="492">Self-Improve · Memory · Pentest Mode</text>
  </g>

  <!-- chip kanan bawah -->
  <g font-family="DejaVu Sans Mono, monospace" font-size="26">
    <rect x="820" y="520" width="300" height="62" rx="31" fill="#12131E" stroke="url(#violet)" stroke-width="2"/>
    <text x="856" y="560" fill="#8B7CF6">● 8/8 SERVICE 200</text>
  </g>
</svg>
