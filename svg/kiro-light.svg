<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <!-- Latar gelap -->
    <radialGradient id="bg" cx="50%" cy="42%" r="72%">
      <stop offset="0%" stop-color="#F5F3EE"/>
      <stop offset="55%" stop-color="#EDEAE3"/>
      <stop offset="100%" stop-color="#E4E0D8"/>
    </radialGradient>
    <!-- Emas utama -->
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C9A44C"/>
      <stop offset="35%" stop-color="#B8860B"/>
      <stop offset="100%" stop-color="#C9A44C"/>
    </linearGradient>
    <!-- Ungu -->
    <linearGradient id="violet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B7CF6"/>
      <stop offset="100%" stop-color="#6D5AE6"/>
    </linearGradient>
    <!-- Glow emas -->
    <filter id="glowG" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Glow ungu -->
    <filter id="glowV" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="circle"><circle cx="256" cy="256" r="256"/></clipPath>
  </defs>

  <g clip-path="url(#circle)">
    <!-- Latar -->
    <rect width="512" height="512" fill="url(#bg)"/>

    <!-- Cincin luar ungu (orbit) -->
    <circle cx="256" cy="256" r="196" fill="none" stroke="url(#violet)" stroke-width="2.5" opacity="0.55"/>
    <circle cx="256" cy="256" r="196" fill="none" stroke="#8B7CF6" stroke-width="1" opacity="0.25"
            stroke-dasharray="6 14"/>

    <!-- Busur emas (arc) -->
    <path d="M 256 60 A 196 196 0 0 1 452 256" fill="none" stroke="url(#gold)" stroke-width="4"
          stroke-linecap="round" filter="url(#glowG)"/>

    <!-- Titik node di orbit -->
    <circle cx="256" cy="60"  r="9" fill="url(#gold)"   filter="url(#glowG)"/>
    <circle cx="452" cy="256" r="7" fill="#8B7CF6"      filter="url(#glowV)"/>
    <circle cx="256" cy="452" r="6" fill="#E8C87A"      opacity="0.85"/>
    <circle cx="60"  cy="256" r="5" fill="#6D5AE6"      opacity="0.8"/>

    <!-- Garis penghubung (circuit) -->
    <g stroke="#E8C87A" stroke-width="1.6" opacity="0.35">
      <line x1="256" y1="60"  x2="256" y2="150"/>
      <line x1="452" y1="256" x2="370" y2="256"/>
      <line x1="256" y1="452" x2="256" y2="372"/>
      <line x1="60"  y1="256" x2="142" y2="256"/>
    </g>

    <!-- Heksagon (shield) -->
    <path d="M 256 132 L 350 186 L 350 294 L 256 348 L 162 294 L 162 186 Z"
          fill="none" stroke="url(#gold)" stroke-width="3" opacity="0.9" filter="url(#glowG)"/>

    <!-- Monogram K -->
    <g filter="url(#glowG)">
      <path d="M 208 178 L 208 334" stroke="url(#gold)" stroke-width="17" stroke-linecap="round"/>
      <path d="M 208 258 L 300 178" stroke="url(#gold)" stroke-width="17" stroke-linecap="round"/>
      <path d="M 208 258 L 302 334" stroke="url(#gold)" stroke-width="17" stroke-linecap="round"/>
    </g>

    <!-- Aksen ungu kecil (agent dot) -->
    <circle cx="322" cy="196" r="6.5" fill="#8B7CF6" filter="url(#glowV)"/>
  </g>
</svg>
